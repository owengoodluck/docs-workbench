<text x="379.0" y="383.8" font-family='system-ui, -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif' font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="379.0" dy="0">Collect</tspan><tspan x="379.0" dy="17.5">merge · dedupe</tspan></text>
