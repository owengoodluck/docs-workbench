<text x="616" y="253.4" font-family='system-ui, -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif' font-size="12" fill="#185fa5" text-anchor="start"><tspan x="616" dy="0">REST request / response data</tspan></text>
<rect x="60" y="508" width="1032" height="132" rx="8" fill="#fbfaf7" stroke="#dcdad4" stroke-width="2" />
<text x="82" y="535.3" font-family='system-ui, -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif' font-size="14" fill="#185fa5" text-anchor="start"><tspan x="82" dy="0">What changes</tspan></text>
<text x="82" y="565.3" font-family='system-ui, -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif' font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="82" dy="0">· Sensor ×N / Collect: unchanged</tspan><tspan x="82" dy="17.5">· Exchange: counterparty A → B (SFTP file round-trip → synchronous REST call)</tspan><tspan x="82" dy="17.5">· Output: parse returned file → aggregate responses and write file</tspan><tspan x="82" dy="17.5">· Ready: new, file-availability sensor</tspan></text>
<text x="60" y="671.4" font-family='system-ui, -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif' font-size="12" fill="#6b6b68" text-anchor="start"><tspan x="60" dy="0">Assumption A1: System B is synchronous. If it is asynchronous, a polling stage must follow Exchange.</tspan></text>
</svg>
