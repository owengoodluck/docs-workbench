<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 668" width="1120" height="668" role="img">
<title>Security ID 采集链路：本系统与外部系统交互</title>
<defs>
<marker id="fwd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="rev" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="1120" height="668" fill="#ffffff"/>
<text x="60" y="55.849999999999994" font-family='system-ui, -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif' font-size="23" fill="#1e1e1e" text-anchor="start"><tspan x="60" dy="0">Security ID 采集链路：本系统与外部系统交互</tspan></text>
<text x="60" y="87.3" font-family='system-ui, -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif' font-size="14" fill="#6b6b68" text-anchor="start"><tspan x="60" dy="0">System A（SFTP）→ System B（REST）· 只替换交互对象，内部环节结构不变</tspan></text>
<rect x="360" y="140" width="250" height="86" rx="8" fill="#f2f1ee" stroke="#9a9a96" stroke-width="2" stroke-dasharray="8 6" />
<text x="485" y="170.05" font-family='system-ui, -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif' font-size="14" fill="#5f5e5a" text-anchor="middle"><tspan x="485" dy="0">System A</tspan><tspan x="485" dy="17.5">外部系统 · SFTP 文件交换</tspan><tspan x="485" dy="17.5">即将下线</tspan></text>
<rect x="730" y="140" width="250" height="86" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="2" />
<text x="855" y="170.05" font-family='system-ui, -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif' font-size="14" fill="#0c447c" text-anchor="middle"><tspan x="855" dy="0">System B</tspan><tspan x="855" dy="17.5">外部系统 · REST API</tspan><tspan x="855" dy="17.5">新增对接</tspan></text>
<line x1="618" y1="183" x2="722" y2="183" stroke="#a32d2d" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#fwd)" marker-start="url(#rev)" />
<text x="632" y="164.35" font-family='system-ui, -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif' font-size="13" fill="#a32d2d" text-anchor="start"><tspan x="632" dy="0">本次替换</tspan></text>
<rect x="60" y="280" width="990" height="190" rx="8" fill="#f6faff" stroke="#85b7eb" stroke-width="2" />
<text x="82" y="300.35" font-family='system-ui, -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif' font-size="13" fill="#185fa5" text-anchor="start"><tspan x="82" dy="0">本系统 · Airflow DAG</tspan></text>
<rect x="96" y="350" width="150" height="76" rx="8" fill="#ffffff" stroke="#3f3f3c" stroke-width="2" />
<text x="171.0" y="383.8" font-family='system-ui, -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif' font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="171.0" dy="0">Sensor ×N</tspan><tspan x="171.0" dy="17.5">等上游文件</tspan></text>
<rect x="286" y="350" width="150" height="76" rx="8" fill="#ffffff" stroke="#3f3f3c" stroke-width="2" />
<text x="361.0" y="383.8" font-family='system-ui, -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif' font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="361.0" dy="0">Collect</tspan><tspan x="361.0" dy="17.5">合并 · 提取 ID</tspan></text>
<rect x="476" y="350" width="150" height="76" rx="8" fill="#dbe9f8" stroke="#185fa5" stroke-width="2" />
<text x="551.0" y="383.8" font-family='system-ui, -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif' font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="551.0" dy="0">Exchange</tspan><tspan x="551.0" dy="17.5">发请求 · 收响应</tspan></text>
<rect x="666" y="350" width="150" height="76" rx="8" fill="#ffffff" stroke="#3f3f3c" stroke-width="2" />
<text x="741.0" y="383.8" font-family='system-ui, -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif' font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="741.0" dy="0">Output</tspan><tspan x="741.0" dy="17.5">汇总 · 写文件</tspan></text>
<rect x="856" y="350" width="150" height="76" rx="8" fill="#ffffff" stroke="#3f3f3c" stroke-width="2" />
<text x="931.0" y="383.8" font-family='system-ui, -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif' font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="931.0" dy="0">Ready</tspan><tspan x="931.0" dy="17.5">文件就绪</tspan></text>
<line x1="250" y1="388.0" x2="282" y2="388.0" stroke="#1e1e1e" stroke-width="2" marker-end="url(#fwd)" />
<line x1="440" y1="388.0" x2="472" y2="388.0" stroke="#1e1e1e" stroke-width="2" marker-end="url(#fwd)" />
<line x1="630" y1="388.0" x2="662" y2="388.0" stroke="#1e1e1e" stroke-width="2" marker-end="url(#fwd)" />
<line x1="820" y1="388.0" x2="852" y2="388.0" stroke="#1e1e1e" stroke-width="2" marker-end="url(#fwd)" />
<line x1="505" y1="350" x2="490" y2="226" stroke="#5f5e5a" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#fwd)" marker-start="url(#rev)" />
<line x1="600" y1="350" x2="830" y2="226" stroke="#185fa5" stroke-width="2" marker-end="url(#fwd)" marker-start="url(#rev)" />
<text x="300" y="269.4" font-family='system-ui, -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif' font-size="12" fill="#5f5e5a" text-anchor="start"><tspan x="300" dy="0">SFTP 请求 / 响应文件</tspan></text>
<text x="616" y="269.4" font-family='system-ui, -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif' font-size="12" fill="#185fa5" text-anchor="start"><tspan x="616" dy="0">REST 请求 / 响应数据</tspan></text>
<rect x="60" y="508" width="990" height="112" rx="8" fill="#fbfaf7" stroke="#dcdad4" stroke-width="2" />
<text x="82" y="535.3" font-family='system-ui, -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif' font-size="14" fill="#185fa5" text-anchor="start"><tspan x="82" dy="0">变更点</tspan></text>
<text x="82" y="565.3" font-family='system-ui, -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif' font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="82" dy="0">· Sensor ×N / Collect：不变</tspan><tspan x="82" dy="17.5">· Exchange：外部对象由 A 换为 B（SFTP 文件往返 → REST 同步调用）</tspan><tspan x="82" dy="17.5">· Output：解析回写文件 → 汇总响应写文件</tspan><tspan x="82" dy="17.5">· Ready：新增，文件就绪 Sensor</tspan></text>
<text x="60" y="649.4" font-family='system-ui, -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif' font-size="12" fill="#6b6b68" text-anchor="start"><tspan x="60" dy="0">假设 A1：System B 为同步接口；若为异步，需在 Exchange 之后插入轮询环节。</tspan></text>
</svg>
